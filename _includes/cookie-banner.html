<div 
  id="cookie-banner" 
  class="cookie-banner" 
  role="dialog" 
  aria-labelledby="cookie-banner-title" 
  aria-describedby="cookie-banner-desc"
  aria-modal="true"
>
  <p id="cookie-banner-title" class="sr-only">Cookie consent</p>

  <p id="cookie-banner-desc">
    This website uses cookies to improve your experience. 
    You can accept or reject non-essential cookies.
  </p>
<p id="cookie-banner-desc">
    View our <a href="{{ site.baseurl }}/cookies.html">Cookies Policy</a> for more information.
</p>
  <div class="cookie-buttons" aria-live="polite">
    <button aria-label="Accept cookies" id="cookie-accept">Accept</button>
    <button aria-label="Reject cookies" id="cookie-reject">Reject</button>
  </div>
</div>
